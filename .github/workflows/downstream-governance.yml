name: Downstream governance

on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate immutable commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and validate the event head as Git objects
        id: validation
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/governance/pr-head"
          fetched_head_sha="$(git rev-parse --verify 'refs/remotes/governance/pr-head^{commit}')"
          test "${fetched_head_sha}" = "${HEAD_SHA}"
          python3 tools/governance/validate_commits.py \
            --repository . \
            --base "${BASE_SHA}" \
            --head "${fetched_head_sha}"

      - name: Publish final status on the event head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          state=failure
          description="Immutable commit contract failed"
          if [[ "${VALIDATION_OUTCOME}" == "success" ]]; then
            state=success
            description="Immutable commit contract passed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context="Downstream governance" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
