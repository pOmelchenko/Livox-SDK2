name: Downstream governance

on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Mark current head pending before validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context="Downstream governance" \
            -f description="Governance validation running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out the trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require identity-preserving repository merge settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}"
          |
          python3 tools/governance/validate_repository_settings.py

      - name: Fetch pull-request metadata without checking out its code
        run: >-
          git fetch --no-tags origin
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/governance/pr-head"

      - name: Validate downstream commit and pull-request contracts
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/governance/validate_commits.py \
            --base "${BASE_SHA}" \
            --head refs/remotes/governance/pr-head \
            --issue-repository "${GITHUB_REPOSITORY}"
          python3 tools/governance/validate_pull_request.py \
            --repository "${GITHUB_REPOSITORY}" \
            --number "${PR_NUMBER}" \
            --repository-path . \
            --base "${BASE_SHA}" \
            --head refs/remotes/governance/pr-head

      - name: Publish the required status on the pull-request head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          state=failure
          description="Governance contract validation failed"
          if [[ "${VALIDATION_OUTCOME}" == "success" ]]; then
            state=success
            description="Governance contract validation passed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context="Downstream governance" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  invalidate-after-base-update:
    name: Require open pull-request revalidation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark open pull-request heads pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base master \
            --state open \
            --limit 1000 \
            --json headRefOid \
            --jq '.[].headRefOid' |
          while IFS= read -r head_sha; do
            [[ -n "${head_sha}" ]] || continue
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state=pending \
              -f context="Downstream governance" \
              -f description="Base changed; governance revalidation required" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
