name: Downstream governance

on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  validate:
    name: Governance
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: >-
        downstream-governance-${{ github.repository }}-head-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Mark current head pending before validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context="Downstream governance" \
            -f description="Governance validation running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out the trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require identity-preserving repository merge settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}"
          |
          python3 tools/governance/validate_repository_settings.py

      - name: Fetch pull-request metadata without checking out its code
        run: |
          git fetch --no-tags origin
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/governance/pr-head"
          fetched_head_sha="$(git rev-parse refs/remotes/governance/pr-head)"
          [[ "${fetched_head_sha}" == "${HEAD_SHA}" ]]

      - name: Validate downstream commits and every pull-request contract on head
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/governance/validate_commits.py \
            --base "${BASE_SHA}" \
            --head refs/remotes/governance/pr-head \
            --issue-repository "${GITHUB_REPOSITORY}"

          same_head_pr_numbers="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --state open \
              --limit 1000 \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"${HEAD_SHA}\") | .number"
          )"
          [[ -n "${same_head_pr_numbers}" ]]

          event_pr_seen=false
          while IFS= read -r same_head_pr_number; do
            [[ -n "${same_head_pr_number}" ]] || continue
            if [[ "${same_head_pr_number}" == "${PR_NUMBER}" ]]; then
              event_pr_seen=true
            fi
            python3 tools/governance/validate_pull_request.py \
              --repository "${GITHUB_REPOSITORY}" \
              --number "${same_head_pr_number}" \
              --repository-path . \
              --base "${BASE_SHA}" \
              --head refs/remotes/governance/pr-head
          done <<< "${same_head_pr_numbers}"
          [[ "${event_pr_seen}" == "true" ]]

      - name: Publish the required status on the pull-request head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          state=failure
          description="Governance contract validation failed"
          if [[ "${VALIDATION_OUTCOME}" == "success" ]]; then
            if current_pr_identity="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '[.head.sha, .base.sha, .base.ref] | @tsv'
            )"; then
              IFS=$'\t' read -r current_head_sha current_pr_base_sha current_base_ref \
                <<< "${current_pr_identity}"
            else
              current_head_sha=""
              current_pr_base_sha=""
              current_base_ref=""
            fi
            if [[ "${current_head_sha}" != "${HEAD_SHA}" ||
                  "${current_pr_base_sha}" != "${BASE_SHA}" ||
                  "${current_base_ref}" != "master" ]]; then
              state=pending
              description="Pull-request identity changed; governance revalidation required"
            elif current_base_sha="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
                --jq .object.sha
            )"; then
              if [[ "${current_base_sha}" == "${BASE_SHA}" ]]; then
                state=success
                description="Governance contract validation passed"
              else
                state=pending
                description="Base changed; governance revalidation required"
              fi
            else
              description="Could not confirm the current governance base"
            fi
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context="Downstream governance" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  invalidate-after-governance-input-update:
    name: Require open pull-request revalidation
    if: github.event_name == 'push' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark open pull-request heads pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description="Base changed; governance revalidation required"
          if [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            description="Governing issue changed; governance revalidation required"
          fi
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base master \
            --state open \
            --limit 1000 \
            --json headRefOid \
            --jq '.[].headRefOid' |
          while IFS= read -r head_sha; do
            [[ -n "${head_sha}" ]] || continue
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state=pending \
              -f context="Downstream governance" \
              -f description="${description}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
