name: Third-party candidate
description: Submit one immutable third-party commit for one downstream problem.
title: "[Candidate]: "
labels:
  - "intake:third-party"
body:
  - type: markdown
    attributes:
      value: >-
        Third-party provenance is required at intake. After submission,
        automation captures the downstream base and adds the maintainer-owned
        qualification prompts.

  - type: textarea
    id: source_provenance
    attributes:
      label: Immutable source provenance
      description: Give the repository URL, full 40-character commit SHA, original author, license, attribution, and notice requirements.
    validations:
      required: true

  - type: textarea
    id: problem_evidence
    attributes:
      label: Problem and current relevance
      description: Describe the downstream problem and the evidence that this candidate may still apply.
    validations:
      required: true

  - type: input
    id: tested_revision
    attributes:
      label: Downstream revision evaluated
      description: Optionally give the downstream tag, branch, or commit SHA used for your evaluation.
      placeholder: Optional
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Optionally identify useful files or hunks, conflicts, alternatives, safe logs, or verification ideas.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Intake confirmation
      options:
        - label: I verified the repository, immutable commit, original author, license, and notices.
          required: true
        - label: This is one candidate for one problem, not a branch or patch-series import.
          required: true
