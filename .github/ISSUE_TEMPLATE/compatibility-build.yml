name: Compatibility or build work
description: Report one compiler, platform, dependency, packaging, API/ABI, or consumer concern.
title: "[Compatibility]: "
labels:
  - "intake:compatibility"
body:
  - type: markdown
    attributes:
      value: >-
        Record the evidence you have now. After submission, automation captures
        the downstream base and adds the maintainer-owned qualification prompts.

  - type: dropdown
    id: concern
    attributes:
      label: Primary concern
      options:
        - Compiler or language mode
        - Operating system or architecture
        - Build system or dependency
        - Packaging or installation
        - Public API or ABI
        - Consumer integration
    validations:
      required: true

  - type: textarea
    id: problem_evidence
    attributes:
      label: Problem and consumer evidence
      description: Describe the observed result, expected result, affected consumer, and why downstream work may be needed.
    validations:
      required: true

  - type: textarea
    id: environment_evidence
    attributes:
      label: Environment and command
      description: Give the toolchain, OS, architecture, dependencies, configuration, and exact command details you know.
    validations:
      required: true

  - type: input
    id: tested_revision
    attributes:
      label: Tested revision
      description: Optionally give the tag, branch, or commit SHA you actually tested.
      placeholder: Optional
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Optionally add safe logs, links, constraints, alternatives, or verification ideas.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Intake confirmation
      options:
        - label: This issue contains one independently reviewable compatibility or build concern.
          required: true
        - label: I separated completed evidence from assumptions and removed sensitive data.
          required: true
