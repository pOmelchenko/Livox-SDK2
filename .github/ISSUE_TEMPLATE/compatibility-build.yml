name: Compatibility or build work
description: Propose one compiler, platform, dependency, packaging, API/ABI, or consumer change.
title: "[Compatibility]: "
body:
  - type: dropdown
    id: concern
    attributes:
      label: Primary concern
      options:
        - Compiler or language mode
        - Operating system or architecture
        - Build system or dependency
        - Packaging or installation
        - Public API or ABI
        - Consumer integration
    validations:
      required: true

  - type: input
    id: downstream_base
    attributes:
      label: Downstream base
      description: Give the exact 40-character downstream commit SHA evaluated.
    validations:
      required: true

  - type: textarea
    id: environment_evidence
    attributes:
      label: Environment and current-base evidence
      description: Identify toolchain, OS, architecture, dependencies, exact commands, and observed result.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope, non-goals, value, and alternatives
      description: State the smallest change, affected matrix entry, excluded concerns, consumer value, alternatives, and decision.
    validations:
      required: true

  - type: dropdown
    id: disposition
    attributes:
      label: Proposed disposition
      options:
        - Accept
        - Defer
        - Reject
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Source attribution and agent disclosure
      description: State project-owned or immutable source provenance, license/notices, and Agent-Authored, Agent-Assisted, or Agent-Authorship identity.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility analysis
      description: Cover source, binary, wire, platform, packaging, migration, and consumer impact.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Required verification
      description: List the focused regression and supported build/platform matrix.
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Upstream disposition
      description: Link an upstream PR, give a deferred owner and trigger, or explain a downstream-only decision.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Intake confirmation
      options:
        - label: This issue contains one independently reviewable compatibility or build concern.
          required: true
        - label: Completed local evidence is separated from pending platform qualification.
          required: true
