name: Downstream defect
description: Report one reproducible defect in the maintained downstream SDK.
title: "[Defect]: "
labels:
  - "intake:defect"
body:
  - type: markdown
    attributes:
      value: >-
        Record the evidence you have now. After submission, automation captures
        the downstream base and adds the maintainer-owned qualification prompts.

  - type: dropdown
    id: reproduction_scope
    attributes:
      label: Reproduction scope
      description: State where you have observed the problem so far.
      options:
        - Downstream only
        - Official upstream too
        - Not yet compared with upstream
    validations:
      required: true

  - type: textarea
    id: problem_evidence
    attributes:
      label: Problem and reproduction
      description: Describe actual and expected behavior, the affected consumer, and the smallest known reproduction.
    validations:
      required: true

  - type: textarea
    id: environment_evidence
    attributes:
      label: Relevant environment
      description: Give the OS, architecture, toolchain, device, configuration, and exact command details you know.
    validations:
      required: true

  - type: input
    id: tested_revision
    attributes:
      label: Tested revision
      description: Optionally give the tag, branch, or commit SHA you actually tested.
      placeholder: Optional
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Optionally add safe logs, links, screenshots, suspected scope, or verification ideas.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Intake confirmation
      options:
        - label: This issue reports one independently reviewable defect.
          required: true
        - label: I removed credentials, private network details, raw captures, and build artifacts.
          required: true
